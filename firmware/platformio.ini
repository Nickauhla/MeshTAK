; -----------------------------------------------------------------------------
; MeshRadio — firmware LilyGO T-Beam Supreme (ESP32-S3 + SX1262 + GNSS)
;
;   pio run -e tbeam-supreme -t upload    : flasher la carte
;   pio device monitor                     : console série (115200)
;   pio test -e native                     : valider le codec contre les vecteurs partagés
; -----------------------------------------------------------------------------
[platformio]
default_envs = tbeam-supreme

[env:tbeam-supreme]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    ; La T-Beam Supreme expose l'USB natif de l'ESP32-S3 : la console série passe
    ; par le CDC. Si aucun texte n'apparaît au moniteur, mettre ces deux lignes à 0
    ; (carte équipée d'un pont USB-UART).
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1

lib_deps =
    jgromes/RadioLib@^7.1.2
    mikalhart/TinyGPSPlus@^1.0.3
    h2zero/NimBLE-Arduino@^1.4.2
    lewisxhe/XPowersLib@^0.2.7
    olikraus/U8g2@^2.35.30

; --- Tests unitaires du protocole, exécutés sur le PC ------------------------
; Valide que le codec C++ produit exactement les octets du codec TypeScript.
[env:native]
platform = native
build_flags = -std=gnu++17 -Iinclude
test_framework = unity
