# -----------------------------------------------------------------------------
# Construit un .ipa iOS NON SIGNÉ sur un runner macOS de GitHub.
#
# Pourquoi non signé : la signature se fait ensuite sur le PC Windows avec
# Sideloadly, qui utilise votre identifiant Apple gratuit. Aucune clé, aucun
# certificat et aucun secret ne transite donc par GitHub.
#
# Le Bluetooth ne réclame aucun droit payant chez Apple : une déclaration d'usage
# dans Info.plist suffit, ce que fait l'étape « Déclarer l'usage du Bluetooth ».
#
# Lancement : onglet Actions -> « iOS (ipa non signé) » -> Run workflow.
# -----------------------------------------------------------------------------
name: iOS (ipa non signé)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installer les dépendances
        working-directory: app
        run: npm ci

      - name: Vérifier le protocole avant de construire
        working-directory: app
        run: npm test

      - name: Construire le web
        working-directory: app
        run: npm run build

      # Le dossier ios/ n'est pas versionné : il est régénéré à chaque fois, ce
      # qui évite d'avoir besoin d'un Mac en local pour l'initialiser.
      - name: Ajouter la plateforme iOS
        working-directory: app
        run: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios

      - name: Déclarer l'usage du Bluetooth
        working-directory: app/ios/App/App
        run: |
          plutil -replace NSBluetoothAlwaysUsageDescription \
            -string "MeshRadio se connecte à votre boîtier radio T-Beam." Info.plist \
          || plutil -insert NSBluetoothAlwaysUsageDescription \
            -string "MeshRadio se connecte à votre boîtier radio T-Beam." Info.plist
          plutil -p Info.plist | grep Bluetooth

      - name: Compiler sans signature
        working-directory: app/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      # Un .ipa n'est rien d'autre qu'un zip contenant un dossier Payload/.
      - name: Empaqueter en .ipa
        working-directory: app/ios/App
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry MeshTAK-unsigned.ipa Payload

      # Le journal d'un run n'est lisible qu'authentifié, alors que sa conclusion
      # est publique : on encode donc les vérifications en code de sortie plutôt
      # qu'en texte. Un bundle amputé fait échouer le job, au lieu de produire un
      # .ipa d'apparence saine qui planterait à l'ouverture sur l'iPhone.
      - name: Vérifier que le bundle est complet
        working-directory: app/ios/App
        run: |
          APP=Payload/App.app
          ls -la "$APP"
          file "$APP/App"
          ls -la "$APP/Frameworks" || echo "pas de dossier Frameworks (normal si les pods sont liés statiquement)"

          test -f "$APP/App" || { echo "::error::exécutable absent du bundle"; exit 1; }
          test -f "$APP/public/index.html" || { echo "::error::assets web absents du bundle"; exit 1; }
          test -f "$APP/public/assets/index"*.js || { echo "::error::bundle JavaScript absent"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :NSBluetoothAlwaysUsageDescription" "$APP/Info.plist" \
            || { echo "::error::déclaration Bluetooth absente : l'app serait incapable de scanner"; exit 1; }

          echo "Taille de l'exécutable : $(du -h "$APP/App" | cut -f1)"
          echo "Taille du .ipa        : $(du -h MeshTAK-unsigned.ipa | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: MeshTAK-ipa
          path: app/ios/App/MeshTAK-unsigned.ipa
          if-no-files-found: error
